# agent-harness — a Rust framework for driving agent CLIs, with adapters.
#
# Crates (the dependency arrow only points up):
#   * cli-stream    — generic streaming-subprocess engine: spawn a CLI,
#                     stream stdout/stderr line-by-line, cancel
#                     (SIGTERM→SIGKILL), and augment PATH so a Node-based
#                     CLI resolves even from a packaged .app. No agent or
#                     harness knowledge. [publishable]
#   * agent-harness — the framework (imported as `harness`): the `Harness` trait
#                     + the normalized `RunEvent` vocabulary + an open `Registry`,
#                     with feature-gated adapter modules — claude/codex/acp
#                     (each wraps an external agent) and `openai-compatible` (a
#                     full local-/OpenAI-compatible runtime that *is* the agent).
#                     → cli-stream. [publishable]
[workspace]
resolver = "2"
members = ["crates/cli-stream", "crates/agent-harness"]

# Shared publish metadata + agent-harness's version. Only agent-harness inherits
# `version` here (via `version.workspace = true`); cli-stream versions
# independently, pinning its own `version` in its manifest rather than this line.
[workspace.package]
version = "0.6.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getlatentic/agent-harness"

# Dependencies declared once, referenced with `<dep>.workspace = true` per crate.
# agent-harness depends on the cli-stream `0.3` line — it versions independently
# of agent-harness's 0.4.x and bumps only when it actually changes.
[workspace.dependencies]
cli-stream = { path = "crates/cli-stream", version = "0.4.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed tool-parameter schemas for `openai-compatible`: derive `JsonSchema` on a
# serde struct → JSON Schema for the model (the Rust equivalent of Zod/Pydantic;
# also what `rig` and the official MCP SDK `rmcp` use). 1.x is the current line.
schemars = "1"
thiserror = "2"
# Blocking HTTP for the `openai-compatible` runtime (chat API + Ollama model
# discovery). Blocking fits its thread+callback run() model (no async runtime);
# `json` enables send_json/into_json via serde_json. TLS is on by default
# (rustls) so cloud OpenAI-compatible endpoints work, not just local Ollama.
ureq = { version = "2", features = ["json"] }
# File search for `openai-compatible`'s glob/grep tools — ripgrep's own libraries,
# used in-process (gitignore-aware walk + glob + regex), so no `rg` binary.
ignore = "0.4"
globset = "0.4"
regex = "1"
# HTML → Markdown for `openai-compatible`'s `webfetch` markdown format
# (Turndown-inspired, html5ever-based).
htmd = "0.5"
# The ACP client adapter (`acp` feature). Tracks current ACP (0.14) — the
# role/builder `connect_with` model + v2 protocol schema that current agents
# (opencode / Zed / Gemini) speak (nd-JSON over stdio). `smol` is the
# runtime-agnostic single-threaded executor the connection is driven on;
# `futures-lite` for the async BufReader.
agent-client-protocol = "0.14"
smol = "2"
futures-lite = "2"
async-trait = "0.1"
# Property tests. Dev-only, so it costs a consumer nothing. Used where a
# property is genuinely stronger than the examples — parsers that must survive
# arbitrary bytes, and budgets that must hold for every input — not as a way to
# raise a coverage number.
proptest = "1"
