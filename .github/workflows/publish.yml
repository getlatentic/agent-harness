# Publishing to crates.io, caused by a tag.
#
# The point is what it refuses. A publish cannot be undone — only yanked — so
# the two ways this went wrong both had to become impossible rather than
# discouraged:
#
#   * 0.5.0 was published from a laptop on a green *local* gate, while CI was
#     still running. It failed on Windows and was yanked within the hour. So
#     the tests here are a job this one `needs`, in the same run, on the tagged
#     commit — not a check someone glanced at beforehand.
#   * Six versions shipped from a branch that was never merged, leaving `main`
#     documenting an API three releases stale. So a tag that is not an ancestor
#     of `main` is refused outright.
#   * The version that reaches crates.io comes from the manifest, not the tag,
#     so a tag naming a different one publishes something nobody asked for and
#     only fails afterwards, on the release notes. The two have to agree before
#     anything is published.
#
# There is no publish token. crates.io accepts a short-lived credential minted
# for THIS workflow in THIS repository (trusted publishing), exchanged at run
# time and revoked when the job ends — so there is nothing to store, leak, or
# rotate. Both crates must have the trusted publisher configured on crates.io.
name: publish

on:
  push:
    tags: ["v*", "cli-stream-v*"]

permissions:
  contents: write
  # The OIDC token crates.io exchanges for a 30-minute publish credential.
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A tag can be pushed from anywhere, including a branch that was never
  # reviewed. Publishing from one puts code on crates.io that the default
  # branch does not have — which is exactly what happened, six times.
  guard:
    name: tag is releasable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a tag that is not an ancestor of main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main."
            echo "::error::Merge the release PR first, then tag the merge commit."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main"
      - name: Refuse a tag that names a version the manifest does not carry
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            cli-stream-v*) crate=cli-stream ;    tagged="${GITHUB_REF_NAME#cli-stream-v}" ;;
            v*)            crate=agent-harness ; tagged="${GITHUB_REF_NAME#v}" ;;
          esac
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$crate'))")
          if [ "$tagged" != "$manifest" ]; then
            echo "::error::$GITHUB_REF_NAME would publish $crate $manifest, not $tagged."
            echo "::error::Bump the manifest to $tagged, or retag the version it carries."
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches $crate $manifest"

  test:
    name: test (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.os }}
      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # `--no-fail-fast`: cargo otherwise stops at the first failing test
      # binary, so one broken crate hides every crate behind it.
      - name: Test
        run: cargo test --workspace --all-features --no-fail-fast

  publish:
    name: crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # In dependency order, because agent-harness depends on cli-stream by
      # version: the index has to carry the new cli-stream before the crate
      # that requires it can be verified. `cargo publish` waits for the index
      # itself. Each is skipped when that version is already up, so re-running
      # a half-finished release finishes it instead of failing on the first
      # crate.
      # Exchanges GitHub's OIDC token for a crates.io credential valid for 30
      # minutes. Its post step revokes the credential when the job ends, so a
      # failed run leaves nothing usable behind.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          publish_if_new() {
            local crate="$1"
            local version
            version=$(cargo metadata --no-deps --format-version 1 \
              | python3 -c "import sys,json;print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$crate'))")
            local slug
            slug=$(printf '%s' "$crate" | sed 's/^\(..\)\(..\).*/\1\/\2/')
            if curl -sf "https://index.crates.io/$slug/$crate" | grep -q "\"vers\":\"$version\""; then
              echo "$crate $version is already published — skipping"
              return 0
            fi
            echo "::group::publish $crate $version"
            cargo publish -p "$crate"
            echo "::endgroup::"
          }
          publish_if_new cli-stream
          publish_if_new agent-harness

  # Only the project tag gets notes; cli-stream's is a plain marker, since the
  # two crates share one CHANGELOG.
  notes:
    name: GitHub release
    needs: publish
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the notes for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { collecting = 1; next }
            collecting && /^## \[/  { exit }
            collecting              { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A version with a pre-release suffix is not what someone landing on
          # the repo should be handed as the current release.
          case "$version" in
            *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "agent-harness ${{ steps.notes.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag ${{ steps.notes.outputs.prerelease }}
