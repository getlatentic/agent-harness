# Turn a pushed version tag into a GitHub release, with notes taken from the
# CHANGELOG section for that version.
#
# `cargo release` already bumps, stamps the CHANGELOG and pushes the tag. It
# does not create a GitHub release, which is why 0.4.0 shipped to crates.io with
# no tag and no notes — the process existed and the last step was manual, so it
# was the step that got skipped.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-notes:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The section is delimited by the next `## [` heading. A tag with no
      # matching section fails the job rather than publishing an empty release:
      # a release nobody wrote notes for is worse than a missing one, because it
      # looks finished.
      - name: Extract the notes for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { collecting = 1; next }
            collecting && /^## \[/  { exit }
            collecting              { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [$version]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "agent-harness ${{ steps.notes.outputs.version }}" \
            --notes-file release-notes.md \
            --verify-tag
