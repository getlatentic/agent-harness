name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The deep fuzz run below is worth wall-clock nobody wants on a PR.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A crate that spawns agent CLIs has no business hiding warnings.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports independently: a Windows break must not cancel
      # the macOS/Linux runs, since the point is to see the whole picture.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # The `bob` adapter pulls `keyring`, whose Linux backend links libdbus.
      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # `--all-features` covers what Compose actually consumes (acp +
      # openai-compatible), not just the default CLI adapters.
      - name: Build
        run: cargo build --workspace --all-features --verbose
      # `--no-fail-fast`: without it cargo stops at the first test binary that
      # fails, so a broken crate hides every crate behind it. Fixing five
      # failures in one crate then revealed two in the next, which had been
      # sitting there unrun the whole time — each round costing a full CI cycle
      # to learn one layer. One run should report everything that is wrong.
      - name: Test
        run: cargo test --workspace --all-features --verbose --no-fail-fast

  # The fake-Ollama tests in `tests/ollama_route.rs` run on all three platforms
  # in the matrix above and pin our side of the contract. This job covers what a
  # stand-in cannot: the real vendor drifting. Advisory — a model pull is a
  # network dependency, and Ollama shipping a change shouldn't redden an
  # unrelated PR. Read it, don't gate on it.
  ollama-live:
    name: ollama (live)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # ~400 MB, CPU-fast, and tool-capable — small enough to pull per run.
      OLLAMA_TEST_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ollama-live
      - name: Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Poll rather than sleep — the server is up when /api/tags answers.
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags >/dev/null || { echo "ollama did not start"; exit 1; }
      - name: Pull the test model
        run: ollama pull "$OLLAMA_TEST_MODEL"
      # Named rather than `--ignored` wholesale: the tool contrast test needs a
      # model that can actually complete a tool round trip, and a CPU runner
      # cannot host one. Measured — qwen2.5:0.5b never calls a tool, llama3.2:3b
      # loops to the turn limit without answering, and the model that does work
      # is 13GB. The guarantee it covers has a deterministic test that runs on
      # every platform in the normal suite; this job is for vendor drift.
      - name: Live route test
        run: |
          cargo test --all-features --test ollama_route -- --ignored --nocapture \
            live_ollama_streams_a_real_completion

  msrv:
    # The oldest compiler `rust-version` promises. Every other job runs on
    # stable, so without this the number in Cargo.toml is a claim nobody tests.
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Check on the minimum supported compiler
        run: cargo check --workspace --all-features --all-targets

  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Reported, not enforced: the tree predates this workflow and a repo-wide
      # `cargo fmt` belongs in its own commit, not mixed into unrelated work.
      # Flip to a gate once that lands.
      - name: Format (advisory)
        run: cargo fmt --all --check || true
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets

  # The parsers eat NDJSON an agent CLI wrote, so "never panics" is a promise
  # someone has to keep checking. A target nobody re-runs is not a regression
  # test.
  #
  # On a PR this replays the committed seeds and exits (`-runs=0`): fast,
  # deterministic, and it fails only on an input already known to matter — a
  # PR must never redden because a fuzzer wandered somewhere new. Discovery is
  # the weekly run, where each target gets real time.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    env:
      # cargo-fuzz supplies its own sanitizer RUSTFLAGS; the workspace-wide
      # `-D warnings` would replace them and silently drop the coverage
      # instrumentation that makes fuzzing fuzzing.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
      - name: Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: crates/agent-harness/fuzz
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            limit="-runs=0"          # replay the seeds, then stop
          else
            limit="-max_total_time=300"
          fi
          for target in claude_line codex_line raw_line normalize_event; do
            echo "::group::$target"
            # libFuzzer writes finds into the FIRST corpus directory and reads
            # the rest, so the committed seeds stay as they are. It requires
            # both to exist.
            mkdir -p corpus/"$target"
            cargo fuzz run "$target" corpus/"$target" seeds/"$target" -- $limit
            echo "::endgroup::"
          done
      # A crash leaves the input behind; keep it, because it is the
      # reproduction and the next unit test.
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/agent-harness/fuzz/artifacts/
          if-no-files-found: ignore

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `deny.toml` has been in the tree unrun: advisories, licences and
      # duplicate versions were configured and never checked.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
