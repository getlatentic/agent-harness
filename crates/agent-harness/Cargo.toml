[package]
name = "agent-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Drive LLM coding agents — Claude Code, OpenAI Codex, and local Ollama / OpenAI-compatible models — from Rust behind one trait, with a normalized streaming event vocabulary. Bring your own agent too."
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["llm", "ai-agent", "coding-agent", "claude", "codex"]
categories = ["api-bindings", "command-line-utilities", "development-tools"]

# The harness umbrella: the framework (trait + RunEvent + open Registry,
# re-exporting the engine from `cli-stream`) plus the built-in claude/
# codex adapters as feature-gated modules. Imported as `harness`
# (`use harness::{Harness, Registry, Bob, Claude, Codex}`); with
# `default-features = false` it's just the lean framework — no adapters,
# no keyring.
[lib]
name = "harness"

# docs.rs builds with default features unless told otherwise, and the defaults
# here are only the two CLI adapters — which would leave every type in
# `openai_compatible` (OpenHarness, ApiKey, PromptProfile, the MCP surface)
# missing from the published documentation. `docsrs` also lets items carry a
# feature badge via `doc(cfg(...))`.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The CLI adapters are on by default. Slim the set with
# `default-features = false` + the features you
# want (e.g. just `claude` — no keychain SDK). The local- / OpenAI-compatible
# model runtime is the opt-in `openai-compatible` feature below (off by default;
# it pulls a blocking HTTP client + ripgrep / HTML-md / JSON-schema deps).
default = ["claude", "codex"]
# claude / codex own their CLI's login — no extra deps.
claude = []
codex = []
# The ACP-client adapter: drives an external Agent Client Protocol agent
# (OpenCode, Gemini, Goose, …) over JSON-RPC/stdio. Opt-in (off by default) —
# it pulls the ACP crate + a small async runtime (smol) and spawns external
# agents, so it's heavier and more specialized than the CLI/openai adapters.
acp = ["dep:agent-client-protocol", "dep:smol", "dep:futures-lite", "dep:async-trait"]
# models.dev catalog lookup for `list_models` (Claude→anthropic, Codex→openai):
# one cached JSON GET via a blocking HTTP client. Opt-in — pulls `ureq`.
models-dev = ["dep:ureq"]
# The OpenAI-compatible / local-model runtime — the "we are the agent" archetype
# (vs the claude/codex/acp adapters that wrap an external agent): its own tool
# loop, sessions, skills, subagents, MCP, and permissions, driving any
# OpenAI-compatible or Ollama model. Off by default; heavy (a blocking HTTP client
# + ripgrep search libs + HTML→Markdown + JSON-schema). Pulls in models.dev too.
openai-compatible = ["models-dev", "dep:ureq", "dep:ignore", "dep:globset", "dep:regex", "dep:htmd", "dep:schemars"]

[dependencies]
# The generic subprocess engine (spawn / cancel / PATH augmentation) + the
# ProcessEvent / InstallEvent shapes. Re-exported so adapters + consumers
# reach the engine through this framework crate.
cli-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
# Typed errors for the public API (Error) — derive Display + the
# std::error::Error source chain without hand-writing impls.
thiserror.workspace = true
# ACP-client adapter deps (optional + gated behind the `acp` feature).
agent-client-protocol = { workspace = true, optional = true }
smol = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
# models.dev catalog fetch (optional — gated behind `models-dev`).
ureq = { workspace = true, optional = true }
# `openai-compatible` runtime deps (optional, gated behind that feature): ripgrep
# libraries for the in-process glob/grep tools, HTML→Markdown for `webfetch`, and
# typed JSON schemas (schemars) for tool arguments.
ignore = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
htmd = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Dev-only: the `playground` example's tiny web server (never a lib dependency).
[dev-dependencies]
tiny_http = "0.12"
proptest.workspace = true
# The program/PATH resolver tests create throwaway executable files in a temp
# dir to exercise the executable-bit filter.
tempfile = "3"

# The readiness table covers every archetype, so it needs the ACP adapter as
# well as the default CLI ones.
[[example]]
name = "discover"
required-features = ["acp"]

# The web playground drives a run from the browser over SSE; it needs the local
# runtime (`openai-compatible`) + the ACP adapter (`acp`) to offer both
# archetypes, so it only builds when those features are enabled.
[[example]]
name = "playground"
required-features = ["openai-compatible", "acp"]

# One example per harness. The default-feature ones (claude, codex, setup,
# custom_harness) need no entry; these do, because they only build with their
# adapter's feature enabled.

# ACP agents.
[[example]]
name = "acp"
required-features = ["acp"]

[[example]]
name = "gemini"
required-features = ["acp"]

# The built-in runtime, one entry per provider. They differ only in
# configuration — that is the point of having them side by side.
[[example]]
name = "ollama"
required-features = ["openai-compatible"]

[[example]]
name = "openrouter"
required-features = ["openai-compatible", "models-dev"]

[[example]]
name = "llama_cpp"
required-features = ["openai-compatible"]

[[example]]
name = "tool_call"
required-features = ["openai-compatible"]

# cargo-release stamps the single shared workspace CHANGELOG here — on the last
# crate of the lockstep release — so the version header is inserted exactly
# once (a workspace-wide replacement would run per crate and duplicate it). The
# path is relative to this manifest; the CHANGELOG lives at the workspace root.
[package.metadata.release]
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]

