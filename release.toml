# cargo-release configuration.
#   cargo install cargo-release
#   cargo release <level|version>            # DRY RUN by default — prints the plan
#   cargo release <level|version> --execute  # actually bump + changelog + commit + tag + publish
#
# The two crates release together but do NOT share a version number:
#   * `shared-version` applies to the workspace `version` field, which only
#     agent-harness inherits. cli-stream pins its own and bumps independently,
#     because it is a stable upstream leaf that changes far less often;
#   * so a release produces two different versions, and therefore two tags —
#     which is why cli-stream overrides `tag-name` in its own manifest. With
#     both on the bare `v{version}` scheme, cli-stream reaching 0.4.0 collides
#     with the tag agent-harness already published at 0.4.0, and the release
#     aborts partway through;
#   * cargo-release publishes in dependency order (cli-stream → agent-harness),
#     waiting for each to appear in the index;
#   * the CHANGELOG stamp (below) turns `## [Unreleased]` into a fresh
#     `## [Unreleased]` plus a dated version section.
#
# Pre-1.0 SemVer: a breaking change is `cargo release minor`; additive/fixes are
# `cargo release patch`. Run `cargo semver-checks` first if unsure which.
#
# First release:  cargo release 0.1.0 --execute
# Later releases: cargo release patch --execute   # or minor / major

# cli-stream versions on its own — its consumers pin a `0.x` line that has
# nothing to do with agent-harness's, and 0.6.0-alpha.1 shipped with it at
# 0.4.3. `true` here pulled it to the workspace version on the first pre-release
# cut through this file, so each crate is released with `-p`.
shared-version = false
tag-name = "v{{version}}"

# `cargo release` prepares a release here; it does not perform one.
#
# It used to. The default branch requires a pull request, so cargo-release's
# `git push origin main` was rejected — which put the publish BEFORE the merge
# and made the merge the last, optional, forgettable step. Both failure modes
# duly happened: 0.5.0 went to crates.io before CI finished and had to be
# yanked, and six versions shipped from a branch nobody merged, leaving `main`
# documenting an API that three published versions had already renamed.
#
# So the order is inverted. This bumps, stamps the CHANGELOG, rewrites the
# README version pins, and commits — nothing more:
#
#   cargo release <level>            # dry run, prints the plan
#   cargo release <level> --execute  # bump + changelog + READMEs + commit
#   git push -u origin release/<version> && gh pr create
#
# CI runs on the PR. After it is merged, tagging the merge commit is what
# publishes:
#
#   git switch main && git pull
#   git tag v<version> && git push origin v<version>
#
# `.github/workflows/publish.yml` takes it from there: it re-runs the full test
# matrix, refuses a tag that is not on `main`, then publishes both crates in
# dependency order and creates the GitHub release. Publishing is therefore
# caused by green CI on merged code, rather than merely preceded by a green run
# someone remembered to look at.
push = false
tag = false
publish = false


# Single shared workspace CHANGELOG. Scoped to the agent-harness crate (in its
# [package.metadata.release]) so it stamps exactly once — a workspace-level
# replacement here would run once per crate and duplicate the version header.
